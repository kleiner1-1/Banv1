<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04070a">
<title>BXJO · Terminal V6</title>
<style>
:root{
--bg:#04070a;--bg2:#070c11;--card:#0a1118;--card2:#0d161f;--line:#16222e;--line2:#1f2f3e;
--txt:#e2edf6;--muted:#7d8fa0;--dim:#4e6070;
--neon:#39ff9e;--neon2:#0ecf7a;--cyan:#22d3ee;--blue:#3aa9ff;--violet:#a78bfa;
--wa:#25d366;--ig:#e1306c;--tt:#25f4ee;--tt2:#fe2c55;
--gold:#f0c75e;--gold2:#c99a1f;--red:#ff5f5f;
--mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,"Courier New",monospace;
--r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
background:var(--bg);color:var(--txt);
font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
font-size:14px;line-height:1.5;letter-spacing:-.01em;min-height:100vh;overflow-x:hidden;
}
body:before{
content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
background-image:linear-gradient(#39ff9e08 1px,transparent 1px),linear-gradient(90deg,#39ff9e08 1px,transparent 1px);
background-size:34px 34px;
mask-image:radial-gradient(circle at 50% 20%,#000 20%,transparent 85%);
-webkit-mask-image:radial-gradient(circle at 50% 20%,#000 20%,transparent 85%);
}
body:after{
content:"";position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.35;
background:repeating-linear-gradient(180deg,#0000 0 2px,#00000059 2px 3px);
mix-blend-mode:multiply;
}
.wrap{position:relative;z-index:3;max-width:480px;margin:0 auto;padding:12px 12px calc(44px + env(safe-area-inset-bottom))}

/* ---------- header ---------- */
.header{
display:flex;justify-content:space-between;align-items:center;gap:9px;
background:linear-gradient(180deg,#0b141c,#070d13);
border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;
box-shadow:inset 0 1px 0 #ffffff08,0 0 26px -14px var(--neon);
}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:800;letter-spacing:.14em;font-size:14px}
.mark{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;color:#04120a;
background:linear-gradient(145deg,var(--neon),var(--neon2));box-shadow:0 0 18px -4px var(--neon)}
.mark svg{width:14px;height:14px}
.logo b{color:var(--neon)}
.vtag{font-family:var(--mono);font-size:8px;font-weight:800;letter-spacing:.1em;color:var(--neon);
background:#06170f;border:1px solid #14522f;padding:3px 5px;border-radius:5px}
.status{font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.12em;color:var(--neon);
border:1px solid #14522f;background:#06170f;padding:6px 9px;border-radius:999px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:5px;height:5px;border-radius:50%;background:var(--neon);box-shadow:0 0 9px var(--neon);animation:pulse 1.9s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.7)}}
#diag{font-family:var(--mono);font-size:8.5px;text-align:center;color:var(--dim);margin:9px 0 2px;letter-spacing:.12em;text-transform:uppercase}
#diag.ok{color:#2f9e63}#diag.bad{color:var(--red)}

/* ---------- hero ---------- */
.hero{padding:20px 3px 15px}
.hero .kicker{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--neon);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.hero .kicker i{width:6px;height:6px;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 1.5s infinite}
.glitch{position:relative;font-size:27px;line-height:1.08;font-weight:900;letter-spacing:-.035em}
.glitch em{font-style:normal;background:linear-gradient(100deg,var(--neon),var(--cyan) 55%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.glitch:after{
content:attr(data-t);position:absolute;left:0;top:0;width:100%;
color:var(--cyan);opacity:.55;clip-path:inset(0 0 62% 0);animation:gl 3.6s steps(2) infinite;
}
@keyframes gl{0%,92%,100%{transform:none;opacity:.4}93%{transform:translate(-2px,1px);opacity:.75}96%{transform:translate(2px,-1px);opacity:.6}}
.hero p{color:var(--muted);font-size:12px;margin-top:9px;max-width:36ch;line-height:1.55}
.caret{display:inline-block;width:7px;height:13px;background:var(--neon);vertical-align:-2px;margin-left:3px;animation:blink 1s steps(1) infinite;box-shadow:0 0 8px var(--neon)}
@keyframes blink{50%{opacity:0}}

/* ---------- terminal card ---------- */
.term{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
margin-bottom:12px;overflow:hidden;box-shadow:inset 0 1px 0 #ffffff07,0 16px 34px -30px #000}
.term-bar{display:flex;align-items:center;gap:6px;padding:8px 11px;background:#060b10;border-bottom:1px solid var(--line)}
.tdot{width:7px;height:7px;border-radius:50%;background:#1d2b38}
.tdot.a{background:#ff5f57}.tdot.b{background:#febc2e}.tdot.c{background:#28c840}
.tpath{font-family:var(--mono);font-size:9px;color:var(--dim);margin-left:5px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term-body{padding:15px}

.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
padding:15px;margin-bottom:12px;box-shadow:inset 0 1px 0 #ffffff07,0 16px 34px -30px #000}
h2.tt{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
h2.tt .ico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;
background:#0b1a14;border:1px solid #17402b;color:var(--neon)}
h2.tt .ico svg{width:12px;height:12px}
p.sub{font-size:11px;color:var(--muted);margin:7px 0 13px;line-height:1.55}
p.sub code{font-family:var(--mono);color:var(--neon);font-size:10.5px}

/* ---------- fields ---------- */
label{font-family:var(--mono);font-size:8.5px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;display:block;margin-top:13px}
input,select,textarea{
width:100%;background:#050a0e;border:1px solid var(--line2);color:var(--txt);
padding:12px 13px;border-radius:10px;font-size:14px;font-family:var(--mono);margin-top:5px;
outline:none;transition:border-color .15s,box-shadow .15s;
}
textarea{resize:vertical;min-height:70px;line-height:1.6}
input::placeholder,textarea::placeholder{color:#3c4d5c;font-family:"Inter",sans-serif}
input:focus,select:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px #39ff9e1a}
select{appearance:none;-webkit-appearance:none;
background-image:linear-gradient(45deg,transparent 50%,#5d7285 50%),linear-gradient(135deg,#5d7285 50%,transparent 50%);
background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat}
option,optgroup{background:#070d13;color:var(--txt)}

/* ---------- buttons ---------- */
.btn{width:100%;border:none;padding:13px;border-radius:10px;font-weight:800;font-size:12.5px;cursor:pointer;
font-family:var(--mono);letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:7px;
transition:transform .09s,filter .15s,box-shadow .15s;box-shadow:inset 0 1px 0 #ffffff1f}
.btn svg{width:14px;height:14px}
.btn:active{transform:translateY(1px) scale(.988);filter:brightness(.93)}
.btn:disabled{opacity:.45;box-shadow:none}
.b-neon{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#04120a;box-shadow:inset 0 1px 0 #ffffff59,0 10px 26px -14px var(--neon)}
.b-gold{background:linear-gradient(135deg,#f7d98a,var(--gold2));color:#241a05}
.b-tg{background:linear-gradient(135deg,#31b8f2,#1a7fae);color:#fff}
.b-ghost{background:#0e1922;color:#c3d3e0;border:1px solid var(--line2);box-shadow:inset 0 1px 0 #ffffff0a}
.b-red{background:#180c0e;color:#ff9a9a;border:1px solid #46202a;box-shadow:none}
.b-wa{background:linear-gradient(135deg,#3ce07a,#1da851);color:#03170b;box-shadow:inset 0 1px 0 #ffffff4d,0 10px 26px -14px var(--wa)}
.b-ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b 45%,#6228d7);color:#fff;box-shadow:inset 0 1px 0 #ffffff40,0 10px 26px -14px var(--ig)}
.b-tt{background:linear-gradient(135deg,#25f4ee,#0fb5b0);color:#03201f;box-shadow:inset 0 1px 0 #ffffff59,0 10px 26px -14px var(--tt)}
.mt{margin-top:9px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

/* ---------- toasts ---------- */
.toasts{position:fixed;top:calc(9px + env(safe-area-inset-top));left:0;right:0;z-index:99;display:flex;flex-direction:column;
align-items:center;gap:6px;padding:0 12px;pointer-events:none}
.toast{max-width:430px;width:100%;font-family:var(--mono);font-size:11px;font-weight:700;padding:11px 12px;border-radius:9px;
display:flex;gap:8px;align-items:center;line-height:1.4;background:#0a141c;border:1px solid var(--line2);
box-shadow:0 18px 40px -22px #000;animation:tin .2s ease-out}
.toast svg{width:14px;height:14px;flex:0 0 auto}
.toast.ok{border-color:#1a4a2f;background:#06160e;color:#7cf0aa}
.toast.err{border-color:#46202a;background:#150a0c;color:#ffa3ab}
.toast.info{border-color:#1c3d55;background:#08141d;color:#8fcaff}
.toast.out{animation:tout .2s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* ---------- userbar / balance ---------- */
.userbar{display:flex;justify-content:space-between;align-items:center;gap:9px;background:linear-gradient(180deg,var(--card2),var(--card));
border:1px solid var(--line);border-radius:13px;padding:10px 11px;margin-bottom:10px;box-shadow:inset 0 1px 0 #ffffff07}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.ava{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:14px;
color:#04120a;background:linear-gradient(145deg,var(--neon),var(--neon2));text-transform:uppercase;flex:0 0 auto}
.who b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis}
.who small{font-family:var(--mono);font-size:9px;color:var(--muted)}
.who small.admin{color:var(--gold)}
.logout{font-family:var(--mono);font-size:9.5px;font-weight:800;color:#ff9a9a;background:#150a0c;border:1px solid #46202a;
padding:7px 10px;border-radius:8px;cursor:pointer;letter-spacing:.06em}
.balance{position:relative;overflow:hidden;border-radius:13px;padding:14px 15px;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;
background:linear-gradient(135deg,#1d1606,#100c04);border:1px solid #4d3a0f;box-shadow:inset 0 1px 0 #ffffff12,0 0 30px -18px var(--gold)}
.balance:before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#f0c75e22,transparent 70%);top:-78px;right:-42px}
.balance small{font-family:var(--mono);font-size:8px;font-weight:800;color:#bf9d47;letter-spacing:.2em}
.balance b{font-family:var(--mono);font-size:23px;font-weight:800;color:#f8e2a6;display:block;margin-top:2px;letter-spacing:-.02em}
.chip{position:relative;font-family:var(--mono);font-size:8px;font-weight:800;letter-spacing:.14em;color:var(--gold);
background:#00000059;border:1px solid #4d3a0f;padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:5px}
.chip svg{width:10px;height:10px}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:6px;z-index:20;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;
background:#070d13e6;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:11px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:9px;cursor:pointer;
font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.07em;color:var(--dim);
border:1px solid transparent;transition:.15s}
.tab svg{width:16px;height:16px}
.tab:active{transform:scale(.97)}
.tab.on{color:var(--txt);background:#0e1a23;border-color:var(--line2)}
.tab.on[data-p="wa"]{color:var(--wa);border-color:#1d5c3a;background:#07180f}
.tab.on[data-p="ig"]{color:#ff7ba9;border-color:#5c2340;background:#180a12}
.tab.on[data-p="tt"]{color:var(--tt);border-color:#1c5250;background:#05181a}

/* ---------- platform cards ---------- */
.pcard{display:none}
.pcard.on{display:block;animation:slide .28s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pcard .term{border-color:var(--line)}
.pcard .term-body{padding:15px}
.pcard .term-bar{border-bottom:1px solid var(--line)}
.plat-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.plat-logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.plat-logo svg{width:21px;height:21px}
.plat-name{font-size:14px;font-weight:900;letter-spacing:-.02em}
.plat-name small{display:block;font-family:var(--mono);font-size:8.5px;font-weight:700;color:var(--dim);letter-spacing:.13em;margin-top:2px}
.pcard.wa{--acc:var(--wa)}
.pcard.wa .term{border-color:#1a4d31;box-shadow:inset 0 1px 0 #ffffff07,0 0 34px -26px var(--wa)}
.pcard.wa .plat-logo{background:linear-gradient(140deg,#3ce07a,#128c45);color:#03170b;box-shadow:0 0 20px -8px var(--wa)}
.pcard.wa .motivo.active{border-color:var(--wa);background:#06180f;color:#8df0b3;box-shadow:0 0 0 3px #25d3661f}

.pcard.ig{--acc:var(--ig)}
.pcard.ig .term{border-color:#54223c;box-shadow:inset 0 1px 0 #ffffff07,0 0 34px -26px var(--ig)}
.pcard.ig .plat-logo{background:linear-gradient(140deg,#f9ce34,#ee2a7b 45%,#6228d7);color:#fff;box-shadow:0 0 20px -8px var(--ig)}
.pcard.ig .motivo.active{border-color:var(--ig);background:#170a11;color:#ffa8c6;box-shadow:0 0 0 3px #e1306c1f}
.pcard.ig .handle{display:flex;align-items:stretch;gap:7px}
.pcard.ig .at{width:42px;display:grid;place-items:center;border-radius:10px;margin-top:5px;
background:linear-gradient(140deg,#f9ce34,#ee2a7b 60%,#6228d7);color:#fff;font-weight:900;font-family:var(--mono)}

.pcard.tt{--acc:var(--tt)}
.pcard.tt .term{border-color:#1c5250;box-shadow:inset 0 1px 0 #ffffff07,0 0 34px -26px var(--tt)}
.pcard.tt .plat-logo{background:#04191b;border:1px solid #1c5250;color:var(--tt);box-shadow:0 0 20px -8px var(--tt)}
.pcard.tt .plat-name{text-shadow:-1.4px 0 #fe2c5533,1.4px 0 #25f4ee33}
.pcard.tt .motivo.active{border-color:var(--tt);background:#05181a;color:#9bfaf6;box-shadow:0 0 0 3px #25f4ee1f}
.pcard.tt input{letter-spacing:.05em}
.pcard.tt .ttglitch{animation:ttg 5s infinite}
@keyframes ttg{0%,90%,100%{transform:none}91%{transform:translate(-1px,0)}92%{transform:translate(1.5px,-1px)}93%{transform:none}}

.motivos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.motivo{border:1px solid var(--line2);background:#050a0e;padding:11px 6px;font-family:var(--mono);font-size:10.5px;font-weight:700;
text-align:center;cursor:pointer;border-radius:10px;color:#94a7b8;display:flex;align-items:center;justify-content:center;gap:5px;transition:.14s}
.motivo svg{width:12px;height:12px;opacity:.7}
.motivo:active{transform:scale(.975)}
.motivo.active svg{opacity:1}

/* ---------- number row ---------- */
.input-row{display:flex;gap:6px;margin-top:5px;align-items:stretch}
.prefix{flex:0 0 auto;width:96px;margin:0;text-align:center;font-weight:800;font-size:13px;
background:linear-gradient(135deg,#3ce07a,#128c45);border:none;color:#03170b;padding:12px 4px;background-image:none}
.input-row input{flex:1;min-width:0;margin:0}
.paste{flex:0 0 auto;width:42px;border:1px solid var(--line2);background:#0e1922;color:var(--muted);border-radius:10px;cursor:pointer;display:grid;place-items:center}
.paste svg{width:14px;height:14px}

/* ---------- meta / console ---------- */
.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 3px}
.meta div{background:#050a0e;border:1px solid var(--line);padding:9px;border-radius:9px}
.meta small{font-family:var(--mono);color:var(--dim);font-size:8px;font-weight:800;letter-spacing:.12em}
.meta b{display:block;font-family:var(--mono);font-size:11px;margin-top:3px;word-break:break-all;color:#cfe0ee}
.progress{display:none;margin-top:13px}
.progress.show{display:block;animation:tin .25s}
.bar{height:7px;background:#0a141c;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--neon),var(--cyan));transition:width .18s linear;box-shadow:0 0 14px var(--neon)}
.pcent{font-family:var(--mono);font-size:29px;font-weight:800;text-align:center;margin:9px 0 2px;letter-spacing:-.03em;color:var(--neon);text-shadow:0 0 22px #39ff9e66}
.steps{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.step{font-family:var(--mono);font-size:10.5px;color:#4e6070;display:flex;gap:8px;align-items:center;transition:.2s}
.step .bullet{width:14px;text-align:center;font-size:9px;flex:0 0 auto}
.step.on{color:#8df0b3}
.step.done{color:var(--neon)}
.console{background:#03070a;border:1px solid var(--line);padding:10px;height:140px;overflow-y:auto;border-radius:9px;
font-family:var(--mono);font-size:10px;line-height:1.8;color:#7f93a4;letter-spacing:0}
.console .ok{color:var(--neon)}.console .warn{color:var(--gold)}

/* ---------- success ---------- */
.success{display:none;text-align:center;padding:16px;border:1px solid #1d5033;background:linear-gradient(180deg,#06160e,#05110b);border-radius:12px;margin-top:12px}
.success.show{display:block;animation:tin .3s}
.tick{width:50px;height:50px;border-radius:50%;background:#071e11;border:1px solid #2b7a4c;color:var(--neon);display:grid;place-items:center;margin:0 auto 10px;animation:pop .4s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 26px -8px var(--neon)}
.tick svg{width:22px;height:22px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.success h3{font-size:13.5px;color:#9df3c0;font-weight:800}
.report{background:#03070a;border:1px solid var(--line);border-radius:10px;padding:11px;text-align:left;margin:11px 0}
.report div{font-family:var(--mono);font-size:10.5px;padding:6px 0;border-bottom:1px solid #0a141c;display:flex;justify-content:space-between;gap:9px}
.report div:last-child{border:none;padding-bottom:0}
.report span{color:var(--dim)}
.report b{text-align:right;word-break:break-all;color:#cfe0ee}

/* ---------- admin ---------- */
.admin{background:linear-gradient(180deg,#191306,#100d05);border:1px solid #4d3a0f;border-radius:13px;padding:14px;margin-bottom:11px;box-shadow:inset 0 1px 0 #ffffff0e}
.admin h3{font-family:var(--mono);color:var(--gold);font-size:12px;font-weight:800;display:flex;gap:7px;align-items:center;letter-spacing:.05em}
.admin h3 svg{width:13px;height:13px}
.admin p{font-size:10.5px;color:#b3a47c;margin:7px 0;line-height:1.55}
.codebox{background:#03070a;border:1px dashed var(--gold2);border-radius:10px;padding:13px;margin:9px 0;font-family:var(--mono);
font-size:15px;font-weight:800;letter-spacing:.08em;color:var(--gold);display:none;text-align:center;word-break:break-all}
.codebox.show{display:block;animation:tin .2s}
.list{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.item{background:#050a0e;border:1px solid var(--line);border-radius:9px;padding:9px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-family:var(--mono);font-size:10px}
.item b{color:#cfe0ee;word-break:break-all;font-weight:700}
.item small{color:var(--dim);font-size:9px}
.item .mini{border:1px solid var(--line2);background:#0e1922;color:var(--muted);border-radius:7px;padding:5px 9px;font-size:8.5px;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.stat{background:#03070a;border:1px solid #352a0f;border-radius:9px;padding:9px 5px;text-align:center}
